include classpath("application.conf")
node-address.host = "*"
aws.region = "us-east-1"
messages-storage.enabled = true
messages-storage.uri = "jdbc:h2:/data/elasticmq-h2"
queues-storage.enabled = true
queues-storage.path = "/data/queues.conf"
queues {
  cobranca-comandos {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "cobranca-comandos-dlq", maxReceiveCount = 5 }
  }
  cobranca-comandos-dlq {}
  execucao-comandos {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "execucao-comandos-dlq", maxReceiveCount = 5 }
  }
  execucao-comandos-dlq {}
  ordens-eventos {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue { name = "ordens-eventos-dlq", maxReceiveCount = 5 }
  }
  ordens-eventos-dlq {}
}
