name: oficina-sonar-local

services:
  postgres:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Informe SONAR_DB_PASSWORD no arquivo de ambiente local}
    volumes:
      - sonar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community@sha256:65541accbdb92e27fe770fc6ba99988a3dd5a0c71ffafd67f88abfad366996fa
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Informe SONAR_DB_PASSWORD no arquivo de ambiente local}
      SONAR_WEB_JAVAOPTS: -Xms256m -Xmx512m
      SONAR_CE_JAVAOPTS: -Xms256m -Xmx512m
      SONAR_SEARCH_JAVAOPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

volumes:
  sonar_postgres:
  sonar_data:
  sonar_logs:
  sonar_extensions:
